# Settings shared by all models
[template variables=BEGIN_YEAR]
title=Start year
description=Starting year for time dependent, non-climatological ancillaries.
           =Only used when atmosphere ancillaries are generated.
type=integer

[template variables=END_YEAR]
title=End year
description=End year (inclusive) for time dependent, non-climatological ancillaries.
           =Only used when atmosphere ancillaries are generated.
type=integer

[template variables=GRID_NAMELIST]
title=Grid namelist
description=Target grid namelist to use. Only used with the
           =land_cover and ocean_mesh grid sources.
type=character
ns=domain

[template variables=OCEAN_MESH]
title=Ocean mesh
description=Target ocean mesh to use. Only used with the
           =ocean_mesh grid source.
type=character
ns=domain

[template variables=RESOLUTION]
title=Atmosphere resolution
description=Global atmosphere resolution. Only used with the
           =ocean_mesh grid source.
type=character
ns=domain

[template variables=LAND_SEA_MASK]
title=Land sea mask
description=Land sea mask to use. Only used with the land_sea_mask
           =grid source. Note that when using a land sea
           =mask, land fractions are not included by default-
           =target land fractions must be supplied if desired for
           =atmosphere runs.
type=character
ns=domain

[template variables=LAND_FRACTIONS]
title=Land fractions
description=Land fractions to use. Only used with the land_fractions and
           =land_sea_mask grid sources. When GRID_SOURCE='land_fractions',
           =this is used as the original source of truth for the domain,
           =but when GRID_SOURCE=land_sea_mask, it is copied to the
           =workspace and used to generate the ocean mask
           =(for sea surface ancillaries) and river ancillaries.
type=character
ns=domain

[template variables=VERTICAL_DISCRETIZATION]
title=Vertical discretization
description=UM namelist file describing the vertical discretization
           =for the atmosphere ancillaries. Only used when atmosphere
           =ancillaries are generated.
ns=domain

[template variables=URBAN]
title=Urban
description=Whether to include urban in the land cover conversion.
type=python_boolean
ns=land

[template variables=CCI_YEAR]
title=CCI land cover year
description=Which year to use for the CCI land cover source.
type=integer
ns=land

[template variables=MIN_TILE_FRACTION]
title=Minimum tile fraction
description=Tiles with a fraction below this value are set to 0.0, and the remaining tiles are rescaled to sum to 1.0.
type=real
range=0.0:1.0
ns=land

[template variables=SOIL_INIT_CONDS_METHOD]
title=Soil initial conditions generation method
description=Which method to use for generating the soil initial conditions.
           =Only used when the land model is CABLE.
values='functional'
ns=land

