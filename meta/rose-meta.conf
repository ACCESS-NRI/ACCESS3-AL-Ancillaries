[template variables]
title=Workflow settings
description=Top level controlling switches

# Top level namespaces
[ns=model_selection]
title=Model selection
description=Which model to generate ancillaries for.

[ns=workflow_configuration]
title=Workflow configuration
description=Options for the workflow. Only the options applicable to
           =the selected model are shown.

[ns=workflow_configuration/domain]
title=Domain
description=Definition of the target grid and land sea mask.

[ns=workflow_configuration/land]
title=Land
description=Land surface ancillary options.

[ns=workflow_configuration/atmosphere]
title=Atmosphere
description=Atmosphere ancillary options.

# Model selection
[template variables=MODEL]
title=Target model
description=Which model to generate ancillaries for. Each model has its own
           =set of default settings, and only the settings for the selected
           =model are shown under Workflow configuration.
values='ACCESS-AM3','ACCESS-rAM3','ACCESS-rCM3','CABLE-standalone','JULES-standalone'
trigger=template variables=AM3_LAND_MODEL: 'ACCESS-AM3';
        template variables=AM3_GRID_SOURCE: 'ACCESS-AM3';
        template variables=AM3_ATMOSPHERE_ANCILLARIES: 'ACCESS-AM3';
        template variables=AM3_CALENDAR: 'ACCESS-AM3';
        template variables=RAM3_LAND_MODEL: 'ACCESS-rAM3';
        template variables=RAM3_GRID_SOURCE: 'ACCESS-rAM3';
        template variables=RAM3_ATMOSPHERE_ANCILLARIES: 'ACCESS-rAM3';
        template variables=RAM3_CALENDAR: 'ACCESS-rAM3';
        template variables=RCM3_LAND_MODEL: 'ACCESS-rCM3';
        template variables=RCM3_GRID_SOURCE: 'ACCESS-rCM3';
        template variables=RCM3_ATMOSPHERE_ANCILLARIES: 'ACCESS-rCM3';
        template variables=RCM3_CALENDAR: 'ACCESS-rCM3';
        template variables=CABLE_STANDALONE_LAND_MODEL: 'CABLE-standalone';
        template variables=CABLE_STANDALONE_GRID_SOURCE: 'CABLE-standalone';
        template variables=CABLE_STANDALONE_ATMOSPHERE_ANCILLARIES: 'CABLE-standalone';
        template variables=CABLE_STANDALONE_CALENDAR: 'CABLE-standalone';
        template variables=CABLE_STANDALONE_SOIL_INIT_CONDS_METHOD: 'CABLE-standalone';
        template variables=JULES_STANDALONE_LAND_MODEL: 'JULES-standalone';
        template variables=JULES_STANDALONE_GRID_SOURCE: 'JULES-standalone';
        template variables=JULES_STANDALONE_ATMOSPHERE_ANCILLARIES: 'JULES-standalone';
        template variables=JULES_STANDALONE_CALENDAR: 'JULES-standalone';
        template variables=JULES_STANDALONE_SOIL_INIT_CONDS_METHOD: 'JULES-standalone'
ns=model_selection

# Model specific settings. Each model has its own copy of these settings,
# shown only when that model is selected. Options that depend on another
# option (e.g. RESOLUTION on GRID_SOURCE) are triggered by that model's own
# copy, since rose ignores a setting if any of its triggering parents do.
# ACCESS-AM3
[template variables=AM3_CALENDAR]
title=Target calendar
description=Which calendar to use.
values='360day','gregorian'
sort-key=00
ns=workflow_configuration

[template variables=AM3_GRID_SOURCE]
title=Grid source
description=Where to source the target grid from. Can be defined
           =from the land cover source (uses GRID_NAMELIST), a provided
           =land sea mask (LAND_SEA_MASK), a provided set of land
           =fractions (LAND_FRACTIONS) or an ESMF ocean mesh
           =(OCEAN_MESH and RESOLUTION).
values='land_cover','land_sea_mask','ocean_mesh','land_fractions'
trigger=template variables=AM3_GRID_NAMELIST: 'land_cover';
        template variables=AM3_OCEAN_MESH: 'ocean_mesh';
        template variables=AM3_RESOLUTION: 'ocean_mesh';
        template variables=AM3_LAND_SEA_MASK: 'land_sea_mask';
        template variables=AM3_LAND_FRACTIONS: 'land_fractions', 'land_sea_mask'
sort-key=00
ns=workflow_configuration/domain

[template variables=AM3_GRID_NAMELIST]
title=Grid namelist
description=Target grid namelist to use. Only used with the
           =land_cover grid source.
type=character
sort-key=01
ns=workflow_configuration/domain

[template variables=AM3_OCEAN_MESH]
title=Ocean mesh
description=Target ocean mesh to use. Only used with the
           =ocean_mesh grid source.
type=character
sort-key=01
ns=workflow_configuration/domain

[template variables=AM3_RESOLUTION]
title=Atmosphere resolution
description=Global atmosphere resolution. Only used with the
           =ocean_mesh grid source.
type=character
sort-key=01
ns=workflow_configuration/domain

[template variables=AM3_LAND_SEA_MASK]
title=Land sea mask
description=Land sea mask to use. Only used with the land_sea_mask
           =grid source. Note that when using a land sea
           =mask, land fractions are not included by default-
           =target land fractions must be supplied if desired for
           =atmosphere runs.
type=character
sort-key=01
ns=workflow_configuration/domain

[template variables=AM3_LAND_FRACTIONS]
title=Land fractions
description=Land fractions to use. Only used with the land_fractions and
           =land_sea_mask grid sources. When GRID_SOURCE='land_fractions',
           =this is used as the original source of truth for the domain,
           =but when GRID_SOURCE=land_sea_mask, it is copied to the
           =workspace and used to generate the ocean mask
           =(for sea surface ancillaries) and river ancillaries.
type=character
sort-key=01
ns=workflow_configuration/domain

[template variables=AM3_LAND_MODEL]
title=Target land model
description=Which land model to target for ancillary generation.
values='CABLE','JULES'
sort-key=00
ns=workflow_configuration/land

[template variables=AM3_ATMOSPHERE_ANCILLARIES]
title=Atmosphere ancillaries
description=Whether to include atmosphere ancillaries.
type=python_boolean
trigger=template variables=AM3_AEROSOLS: True;
        template variables=AM3_VERTICAL_DISCRETIZATION: True;
        template variables=AM3_BEGIN_YEAR: True;
        template variables=AM3_END_YEAR: True
sort-key=00
ns=workflow_configuration/atmosphere

[template variables=AM3_AEROSOLS]
title=Which form of atmosphere aerosols to create
description=NetCDF format aerosols are used for AM3, PP format for rAM3.
           =Only used when atmosphere ancillaries are generated.
values='NetCDF','PP'
sort-key=01
ns=workflow_configuration/atmosphere

[template variables=AM3_VERTICAL_DISCRETIZATION]
title=Vertical discretization
description=UM namelist file describing the vertical discretization
           =for the atmosphere ancillaries. Only used when atmosphere
           =ancillaries are generated.
sort-key=01
ns=workflow_configuration/atmosphere

[template variables=AM3_BEGIN_YEAR]
title=Start year
description=Starting year for time dependent, non-climatological ancillaries.
           =Only used when atmosphere ancillaries are generated.
type=integer
sort-key=01
ns=workflow_configuration/atmosphere

[template variables=AM3_END_YEAR]
title=End year
description=End year (inclusive) for time dependent, non-climatological ancillaries.
           =Only used when atmosphere ancillaries are generated.
type=integer
sort-key=01
ns=workflow_configuration/atmosphere

