[template variables]
# Which model to generate ancillaries for. Selects which of the model specific
# settings below (prefixed by the model name) are used.
# Valid options: 'ACCESS-AM3', 'ACCESS-rAM3', 'ACCESS-rCM3', 'CABLE-standalone', 'JULES-standalone'
MODEL='ACCESS-AM3'

# Model specific settings. Only the settings for the chosen MODEL are used.
# <PREFIX>_LAND_MODEL: Which land model to target. Valid options: 'CABLE', 'JULES'
# <PREFIX>_GRID_SOURCE: Whether to use a grid definition and allow the land cover to
#     determine the ocean, or use a reference mask.
#     Valid options: 'land_cover', 'land_sea_mask', 'ocean_mesh' or 'land_fractions'.
# <PREFIX>_ATMOSPHERE_ANCILLARIES: Whether to generate the atmosphere ancillaries
# <PREFIX>_AEROSOLS: Which form of aerosols to create. Valid options: 'NetCDF', 'PP'
# <PREFIX>_CALENDAR: Calendar to use for the temporal ancillaries.
#     Valid options: '360day', 'gregorian'

# ACCESS-AM3
AM3_LAND_MODEL='CABLE'
AM3_GRID_SOURCE='ocean_mesh'
AM3_ATMOSPHERE_ANCILLARIES=True
AM3_AEROSOLS='NetCDF'
AM3_CALENDAR='gregorian'

# ACCESS-rAM3
!!RAM3_LAND_MODEL='JULES'
!!RAM3_GRID_SOURCE='land_cover'
!!RAM3_ATMOSPHERE_ANCILLARIES=True
!!RAM3_AEROSOLS='PP'
!!RAM3_CALENDAR='360day'

# ACCESS-rCM3
!!RCM3_LAND_MODEL='JULES'
!!RCM3_GRID_SOURCE='land_fractions'
!!RCM3_ATMOSPHERE_ANCILLARIES=True
!!RCM3_AEROSOLS='PP'
!!RCM3_CALENDAR='gregorian'

# Offline CABLE
!!CABLE_STANDALONE_LAND_MODEL='CABLE'
!!CABLE_STANDALONE_GRID_SOURCE='land_cover'
!!CABLE_STANDALONE_ATMOSPHERE_ANCILLARIES=False
!!CABLE_STANDALONE_AEROSOLS='NetCDF'
!!CABLE_STANDALONE_CALENDAR='360day'

# Offline JULES
!!JULES_STANDALONE_LAND_MODEL='JULES'
!!JULES_STANDALONE_GRID_SOURCE='land_cover'
!!JULES_STANDALONE_ATMOSPHERE_ANCILLARIES=False
!!JULES_STANDALONE_AEROSOLS='NetCDF'
!!JULES_STANDALONE_CALENDAR='360day'

# Settings shared by all models.
# What year range to span for time dependent, non climatological ancillaries.
# Range is inclusive of start and end. Only used when atmosphere ancillaries are generated.
BEGIN_YEAR=1982
# Which year to use for the CCI land cover
CCI_YEAR=2010
# Project that the job will be run under.
COMPUTE_PROJECT='tm70'
# Development mode. Adds a task which always fails, so the workflow stays active
# after all other tasks complete and tasks can be re-triggered.
DEV_MODE=False
END_YEAR=1984
# Namelist grid definition for land cover and ocean mesh grid soures
GRID_NAMELIST='/g/data/access/TIDS/UM/ancil/data/namelist/grids/grid.n96e/latest/grid.n96e'
# Target atmosphere resolution. Only used with the 'ocean_mesh' grid source.
RESOLUTION='n96e'
# Land fractions to use for land_fractions and land_sea_mask grid source
# Note that they're used differently- when GRID_SOURCE='land_fractions', the land
# fractions are used to generate the mask and all downstream ancils, but when the
# GRID_SOURCE='land_sea_mask', it's copied into the workflow's workspace and used
# to generate the ocean_mask (for the ocean ancils) and the river ancils
LAND_FRACTIONS='/scratch/tm70/lw5085/landfrac_files_rcm3/japan-8km.nc'
# Land sea mask to use for land_sea_mask grid source
LAND_SEA_MASK=''
# Ocean mesh to use. Only applicable when GRID_SOURCE='ocean_mesh'
OCEAN_MESH='/g/data/vk83/configurations/inputs/access-om3/share/meshes/global.25km/2026.06.11/access-om3-25km-ESMFmesh.nc'
# What method to use for soil initial conditions. Only used when LAND_MODEL='CABLE'
SOIL_INIT_CONDS_METHOD='functional'
# Whether to use the urban model
URBAN=False
# The vertical discretization for atmosphere ancillaries. Should be a namelist
# in the UM vertical discretization format.
VERTICAL_DISCRETIZATION='/g/data/access/TIDS/UM/ancil/data/namelist/vertical/vert_85/latest/vert_85'
