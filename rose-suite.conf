[template variables]
# Which form of aerosols to create
AEROSOLS='NetCDF'
# Whether to generate the atmosphere ancillaries
ATMOSPHERE_ANCILLARIES=True
# What year range to span for time dependent, non climatological ancillaries.
# Range is inclusive of start and end
BEGIN_YEAR=1982
# Calendar to use for the temporal ancillaries.
# Valid options: '360day', 'gregorian'
CALENDAR='360day'
# Which year to use for the CCI land cover
CCI_YEAR=2010
# Project that the job will be run under.
COMPUTE_PROJECT='tm70'
END_YEAR=1984
# Namelist grid definition for land cover and ocean mesh grid soures
GRID_NAMELIST='/g/data/access/TIDS/UM/ancil/data/namelist/grids/grid.n96e/latest/grid.n96e'
# Whether to use a grid definition and allow the land cover to
# determine to ocean, or use a reference mask.
# Valid options: 'land_cover', 'land_sea_mask', 'ocean_mesh' or 'land_fractions'.
GRID_SOURCE='ocean_mesh'

RESOLUTION='n96e'
# Land fractions to use for land_fractions and land_sea_mask grid source
# Note that they're used differently- when GRID_SOURCE='land_fractions', the land
# fractions are used to generate the mask and all downstream ancils, but when the
# GRID_SOURCE='land_sea_mask', it's copied into the workflow's workspace and used
# to generate the ocean_mask (for the ocean ancils) and the river ancils
!!LAND_FRACTIONS='/scratch/tm70/lw5085/landfrac_files_rcm3/japan-8km.nc'
# Which land model to target.
# Valid options: 'CABLE', 'JULES'
LAND_MODEL='CABLE'
# Land sea mask to use for land_sea_mask grid source
!!LAND_SEA_MASK=''
# Ocean mesh to use. Only applicable when GRID_SOURCE='ocean_mesh'
OCEAN_MESH='/g/data/vk83/configurations/inputs/access-om3/share/meshes/global.25km/2026.06.11/access-om3-25km-ESMFmesh.nc'
# Whether to generate soil initial conditions
SOIL_INITIAL_CONDITIONS=False
# What method to use for soil initial conditions
SOIL_INIT_CONDS_METHOD='functional'
# Whether to use the urban model
URBAN=False
# The vertical discretization for atmosphere ancillaries. Should be a namelist
# in the UM vertical discretization format.
VERTICAL_DISCRETIZATION='/g/data/access/TIDS/UM/ancil/data/namelist/vertical/vert_85/latest/vert_85'
# Which post-processing steps to apply to the CCI land cover fractions.
# Any subset may be selected- they always run in the fixed order
# 'c4-fraction', 'fix-antarctic-permanent-ice', 'split-grass-types',
# 'min-tile-fraction', regardless of the order they're listed here.
LAND_COVER_PREPROCESSING='fix-antarctic-permanent-ice', 'split-grass-types'
