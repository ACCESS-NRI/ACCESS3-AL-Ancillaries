[template variables]
# Which model to generate ancillaries for. The model sets the land model,
# which atmosphere ancillaries and aerosols are created and the domain. These are
# configured in models/<MODEL>.cylc. Regional and offline models require the domain to be
# set in their model file before running.
# Valid options: 'ACCESS-AM3', 'ACCESS-rAM3', 'ACCESS-rCM3', 'Offline-CABLE', 'Offline-JULES'
MODEL='ACCESS-AM3'
# Project that the job will be run under.
COMPUTE_PROJECT='tm70'
# What year range to span for time dependent, non climatological ancillaries.
# Range is inclusive of start and end
BEGIN_YEAR=1982
END_YEAR=1984
# Calendar to use for the temporal ancillaries.
# Valid options: '360day', 'gregorian'
CALENDAR='360day'
# Which year to use for the CCI land cover
CCI_YEAR=2010
# Whether to use the urban model
URBAN=False

