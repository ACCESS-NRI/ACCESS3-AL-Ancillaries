[template variables]
# Which model to generate ancillaries for. Selects which of the model specific
# settings below (prefixed by the model name) are used.
# Valid options: 'ACCESS-AM3', 'ACCESS-rAM3', 'ACCESS-rCM3', 'CABLE-standalone', 'JULES-standalone', 'CMIP7'
MODEL='ACCESS-AM3'

# Model specific settings. Only the settings for the chosen MODEL are used, and
# settings that don't apply are trigger-ignored (!!). Settings marked
# '<REQUIRED>' must be supplied by the user.
# <PREFIX>_CALENDAR: Calendar to use for the temporal ancillaries. Valid options: '360day', 'gregorian'
# <PREFIX>_GRID_SOURCE: Where to source the target grid from.
#     Valid options: 'land_cover', 'land_sea_mask', 'ocean_mesh' or 'land_fractions'.
# <PREFIX>_GRID_NAMELIST: Namelist grid definition, for the 'land_cover' grid source.
# <PREFIX>_OCEAN_MESH: ESMF ocean mesh, for the 'ocean_mesh' grid source.
# <PREFIX>_RESOLUTION: Target atmosphere resolution, for the 'ocean_mesh' grid source.
# <PREFIX>_LAND_SEA_MASK: Land sea mask, for the 'land_sea_mask' grid source.
# <PREFIX>_LAND_FRACTIONS: Land fractions, for the 'land_fractions' and 'land_sea_mask' grid sources.
#     When GRID_SOURCE='land_fractions', the land fractions are used to generate the mask and
#     all downstream ancils, but when GRID_SOURCE='land_sea_mask', it's copied into the workflow's
#     workspace and used to generate the ocean_mask (for the ocean ancils) and the river ancils.
# <PREFIX>_LAND_MODEL: Which land model to target. Valid options: 'CABLE', 'JULES'
# <PREFIX>_SOIL_INIT_CONDS_METHOD: Method for soil initial conditions. Standalone land models only.
# <PREFIX>_ATMOSPHERE_ANCILLARIES: Whether to generate the atmosphere ancillaries
# <PREFIX>_AEROSOLS: Which form of aerosols to create. Valid options: 'NetCDF', 'PP'
# <PREFIX>_VERTICAL_DISCRETIZATION: Vertical discretization namelist for the atmosphere ancillaries.
# <PREFIX>_BEGIN_YEAR, <PREFIX>_END_YEAR: Inclusive year range for time dependent,
#     non climatological atmosphere ancillaries.

# ACCESS-AM3
AM3_CALENDAR='gregorian'
AM3_GRID_SOURCE='ocean_mesh'
!!AM3_GRID_NAMELIST='/g/data/access/TIDS/UM/ancil/data/namelist/grids/grid.n96e/latest/grid.n96e'
AM3_OCEAN_MESH='/g/data/vk83/configurations/inputs/access-om3/share/meshes/global.25km/2026.06.11/access-om3-25km-ESMFmesh.nc'
AM3_RESOLUTION='n96e'
!!AM3_LAND_SEA_MASK=''
!!AM3_LAND_FRACTIONS='/scratch/tm70/lw5085/landfrac_files_rcm3/japan-8km.nc'
AM3_LAND_MODEL='CABLE'
AM3_ATMOSPHERE_ANCILLARIES=True
AM3_AEROSOLS='NetCDF'
AM3_VERTICAL_DISCRETIZATION='/g/data/access/TIDS/UM/ancil/data/namelist/vertical/vert_85/latest/vert_85'
AM3_BEGIN_YEAR=1982
AM3_END_YEAR=1984

