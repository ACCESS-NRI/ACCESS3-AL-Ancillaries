[command]
# The DEFAULT file comes from the flow.cylc file, as it changes depending on whether
# we're using CABLE or JULES.
default = python ancil_split_grass_types.py ${GRASS_SOURCE} \
	    = --original-fractions=${ORIG_FRACTIONS} --grass-mapping=${GRASS_MAPPING} \
	    = --output=${OUTPUT}
	    =
	    = cp ${OUTPUT}.nc ${ANCIL_TARGET_PATH}/preproc/qrparm.veg.frac_ancil_split_grass_types.nc

[env]
# Source that contains the information to split the grass types
GRASS_SOURCE=${ANCIL_TARGET_PATH}/regridded/NCAR-LULCC.nc

# Current land cover fractions, from ancil_lct or from a previous
# LAND_COVER_PREPROCESSING step, whichever ran last
ORIG_FRACTIONS=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac.nc

# Where to write the new land cover. Overwrites ORIG_FRACTIONS in place, so
# that this step can be freely combined with the other LAND_COVER_PREPROCESSING
# steps regardless of which are selected
OUTPUT=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac
