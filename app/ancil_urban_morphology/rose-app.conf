[command]
# Generate the UCLEM urban morphology fields from the urban source files (one
# GeoTIFF per variable). Files for variables which are not needed are ignored.
default = python ancil_urban_morphology.py ${URBAN_SOURCE_DIR}/global_*_1km_*.tif \
	    = --veg-fraction=${VEG_FRACTION_SOURCE} \
	    = -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Directory of urban morphology GeoTIFFs (e.g. U-Surf), one file per variable
# named global_<VARIABLE>_1km_*.tif
URBAN_SOURCE_DIR=

# Vegetation fractions, defining the target grid, land points and urban tile
VEG_FRACTION_SOURCE=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/urban/qrparm.urban_morphology

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[file:${ANCIL_TARGET_PATH}/urban]
mode=mkdir

[ants_decomposition]
x_split=1
y_split=1

[ants_regridding_horizontal]
scheme=AreaWeighted
