[command]
# Generate the UCLEM urban morphology fields from a directory of urban source
# NetCDF files (one file per variable, with the expected U-Surf v1.1 file names)
default = python ancil_urban_morphology.py ${URBAN_SOURCE_DIR} \
	    = --veg-fraction=${VEG_FRACTION_SOURCE} --urban-tile=${MODEL_URBAN_TILE}\
	    = -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Directory of U-Surf v1.1 urban morphology NetCDF files, one file per variable
URBAN_SOURCE_DIR=/g/data/av17/access-nri/AM3/U-Surf/USurf_1km_netcdf_v1.1

# Vegetation fractions, defining the target grid, land points and urban tile
VEG_FRACTION_SOURCE=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/urban/qrparm.urban_morphology

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[file:${ANCIL_TARGET_PATH}/urban]
mode=mkdir

[ants_decomposition]
x_split=4
y_split=4

[ants_regridding_horizontal]
scheme=AreaWeighted
