[command]
# Generate UCLEM urban morphology fields from U-Surf and the CCI urban tile.
default = bash build_urban_usurf_ancil.sh

[env]
# Directory containing U-Surf v1.1 1 km GeoTIFF inputs.
USURF_DIR=/g/data/pu02/jl8556/ancil_dataset/u-surf/USurf_1km_geotiff_v1.1

# Directory containing prototype base morphology templates, keyed by n96/n512.
# Override BASE below to bypass this lookup.
MORPHOLOGY_TEMPLATE_DIR=/g/data/pu02/jl8556/usurf_ancil/templates

# CCI vegetation ancillary from ancil_lct. The class-15 urban tile defines
# where U-Surf morphology values are written.
VEG=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac_cci

# Base UM morphology ancillary used as the template for the output file.
# Leave empty to use MORPHOLOGY_TEMPLATE_DIR/${RESOLUTION without trailing e}.
BASE=

# Intermediate and final outputs.
GRID_CACHE=${ANCIL_TARGET_PATH}/urban/qrparm.class15_grid.npz
PAYLOAD=${ANCIL_TARGET_PATH}/urban/qrparm.USURF.uclem_morph_920_931.fields.npz
SUMMARY_JSON=${ANCIL_TARGET_PATH}/urban/qrparm.USURF.uclem_morph_920_931.summary.json
OUTPUT=${ANCIL_TARGET_PATH}/urban/qrparm.USURF.uclem_morph_920_931
