[command]
# Removes tiles below a minimum fraction and rescales the rest to sum to 1.0.
default = python ancil_min_tile_fraction.py ${VEGETATION_SOURCE} \
        = --min-tile-fraction=${MIN_TILE_FRACTION} --output=${OUTPUT}

[env]
# Floor for the tile fractions
MIN_TILE_FRACTION=0.1

# Surface area fractions from ancil_split_grass_types
VEGETATION_SOURCE=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac_split_grass.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac
