[command]
# Combines the land ancillaries into a CABLE gridinfo file
default = python cable_gridinfo.py --soil=${SOIL_SOURCE} \
        = --vegetation-fraction=${VEGETATION_FRACTION_SOURCE} \
        = --lai=${LAI_SOURCE} --land-mask=${LAND_MASK_SOURCE} \
        = --output=${OUTPUT} --reference-gridinfo=${REFERENCE_GRIDINFO}

[env]
# Soil ancillary created by merge_soils
SOIL_SOURCE=${ANCIL_TARGET_PATH}/soil/qrparm.soil.nc

# Land cover tile fractions created by ancil_split_grass_types
VEGETATION_FRACTION_SOURCE=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac.nc

# Total LAI created by regrid_LAI
LAI_SOURCE=${ANCIL_TARGET_PATH}/regridded/regridded_lai.nc

# Land mask, which also defines the grid
LAND_MASK_SOURCE=${ANCIL_TARGET_PATH}/land_sea_mask/qrparm.mask.nc

# Optional gridinfo to take the variables the workflow does not generate from
# (Albedo, Ndep, Nfix, Pdust, Pwea, SnowDepth, SoilMoist, SoilTemp, SoilOrder, isoil).
# Leave empty to omit them.
REFERENCE_GRIDINFO=

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/cable/gridinfo.nc

[file:${ANCIL_TARGET_PATH}/cable]
mode=mkdir
